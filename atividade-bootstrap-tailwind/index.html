<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Educação online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!--menu-->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Educação online</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">início</a></li>
                <li class="nav-item"><a class="nav-link" href="outros.componentes.html">Outros componentes</a></li>
                <li class="nav-item"><a class="nav-link" href="tailwind.html">Tailwind</a></li>
            </ul>
        </div>
    </div>
</nav>

<!--Mensagem-->
<div class="alert alert-success text-center m-3" role="alert">
    Bem-vindo á nossa plataforma de cursos!
</div>

<!--Conteúdo principal-->
<div class="container my-5">
    <div class="row jsutify-content-center">
        <div class="col-md-6">
            <div class="card">
                <img src="imgs/images.png" class="card-img-top" alt="Imagem do Curso">
                <div class="card-body">
                    <h5 class="card-title">Curso de Programação</h5>
                    <p class="card-text">Aprenda Programação do zero de forma prática</p>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#infoCurso">Saiba mais</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!--modal-->
<div class="modal fade" id="infoCurso" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Detalhes do Curso</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Curso completo de lógica de programação, HTML, CSS e javascript!
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>    
        </div>
    </div>
</div>

<!--Rodapé-->
<footer class="bg-primary text-white text-center py-3 mt-5">
    @ 2025 Educação online
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
